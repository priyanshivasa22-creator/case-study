<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="View and manage your course enrollments." />
  <title>My Enrollments - CourseHub</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">CourseHub</a>
    <ul class="nav-links" id="nav-links"></ul>
  </nav>

  <div class="page-container">
    <div class="page-header fade-in">
      <h2>My Enrollments</h2>
      <p>Manage your enrolled courses below</p>
    </div>

    <div class="alert" id="enrollment-alert"></div>

    <div class="table-wrapper fade-in fade-in-delay-1" id="enrollment-table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Course</th>
            <th>Instructor</th>
            <th>Credits</th>
            <th>Enrolled On</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="enrollment-tbody">
          <tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:2rem;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer class="footer">&copy; 2026 CourseHub. All rights reserved.</footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!requireAuth()) { /* redirected */ }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const enrollments = await getMyEnrollments();
        const tbody = document.getElementById('enrollment-tbody');

        if (enrollments.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:2rem;">No enrollments yet. <a href="courses.html">Browse courses</a></td></tr>';
          return;
        }

        tbody.innerHTML = enrollments.map(e => `
          <tr>
            <td><strong>${e.courseId?.title || 'Unknown'}</strong></td>
            <td>${e.courseId?.instructor || 'N/A'}</td>
            <td><span class="badge badge-success">${e.courseId?.credits || 0}</span></td>
            <td>${new Date(e.enrollmentDate).toLocaleDateString()}</td>
            <td>
              <button class="btn btn-sm btn-danger" onclick="handleUnenroll('${e._id}')">Unenroll</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('enrollment-tbody').innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--danger);padding:2rem;">Could not load enrollments.</td></tr>';
      }
    });

    async function handleUnenroll(enrollmentId) {
      if (!confirm('Are you sure you want to unenroll from this course?')) return;
      try {
        const data = await unenrollFromCourse(enrollmentId);
        if (data.message === 'Unenrolled successfully') {
          showAlert('enrollment-alert', 'Unenrolled successfully!', 'success');
          setTimeout(() => location.reload(), 800);
        } else {
          showAlert('enrollment-alert', data.message || 'Failed to unenroll', 'error');
        }
      } catch (err) {
        showAlert('enrollment-alert', 'Network error.', 'error');
      }
    }
  </script>
</body>
</html>
