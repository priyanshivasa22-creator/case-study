<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Student dashboard - view your stats and quick actions." />
  <title>Dashboard - CourseHub</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">CourseHub</a>
    <ul class="nav-links" id="nav-links"></ul>
  </nav>

  <div class="page-container">
    <div class="page-header fade-in">
      <h2 id="welcome-msg">Welcome back!</h2>
      <p>Here's an overview of your academic activity</p>
    </div>

    <div class="stats-row fade-in fade-in-delay-1">
      <div class="stat-card">
        <div class="stat-value" id="stat-courses">—</div>
        <div class="stat-label">Available Courses</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-enrolled">—</div>
        <div class="stat-label">Enrolled Courses</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-credits">—</div>
        <div class="stat-label">Total Credits</div>
      </div>
    </div>

    <div class="fade-in fade-in-delay-2" style="display:flex;gap:1rem;flex-wrap:wrap;">
      <a href="courses.html" class="btn btn-primary">Browse Courses</a>
      <a href="enrollments.html" class="btn btn-secondary">My Enrollments</a>
    </div>

    <h3 style="margin-top:2.5rem;margin-bottom:1rem;font-weight:600;color:var(--text-secondary);font-size:0.95rem;" class="fade-in fade-in-delay-2">MY ENROLLED COURSES</h3>
    <div id="enrolled-list" class="card-grid fade-in fade-in-delay-3">
      <p style="color:var(--text-muted);">Loading...</p>
    </div>
  </div>

  <footer class="footer">&copy; 2026 CourseHub. All rights reserved.</footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!requireAuth()) { /* redirected */ }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = getUser();
      if (user) {
        document.getElementById('welcome-msg').textContent = `Welcome, ${user.name}!`;
      }

      try {
        const [courses, enrollments] = await Promise.all([getCourses(), getMyEnrollments()]);

        document.getElementById('stat-courses').textContent = courses.length || 0;
        document.getElementById('stat-enrolled').textContent = enrollments.length || 0;

        const totalCredits = enrollments.reduce((sum, e) => sum + (e.courseId?.credits || 0), 0);
        document.getElementById('stat-credits').textContent = totalCredits;

        const container = document.getElementById('enrolled-list');
        if (enrollments.length === 0) {
          container.innerHTML = '<p style="color:var(--text-muted)">You haven\'t enrolled in any courses yet. <a href="courses.html">Browse courses</a></p>';
        } else {
          container.innerHTML = enrollments.map(e => `
            <div class="card">
              <div class="card-title">${e.courseId?.title || 'Unknown Course'}</div>
              <div class="card-desc">${e.courseId?.description || ''}</div>
              <div class="card-meta">
                <span>👨‍🏫 ${e.courseId?.instructor || 'N/A'}</span>
                <span>📚 ${e.courseId?.credits || 0} Credits</span>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        document.getElementById('enrolled-list').innerHTML = '<p style="color:var(--danger)">Could not load data. Make sure the server is running.</p>';
      }
    });
  </script>
</body>
</html>
