<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Register for a new CourseHub student account." />
  <title>Register - CourseHub</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">CourseHub</a>
    <ul class="nav-links" id="nav-links"></ul>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card fade-in">
      <h2>Create Account</h2>
      <p class="subtitle">Join CourseHub and start your academic journey</p>

      <div class="alert" id="register-alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" placeholder="John Doe" required />
          <div class="error-text" id="err-name"></div>
        </div>
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" placeholder="johndoe123" required />
          <div class="error-text" id="err-username"></div>
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="john@university.edu" required />
          <div class="error-text" id="err-email"></div>
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="Minimum 6 characters" required />
          <div class="error-text" id="err-password"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="register-btn">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    const form = document.getElementById('register-form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      let valid = true;

      const name = document.getElementById('reg-name').value;
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      // Clear previous errors
      ['name','username','email','password'].forEach(f => clearFieldError(`reg-${f}`, `err-${f}`));

      if (!validateRequired(name)) { showFieldError('reg-name','err-name','Name is required'); valid = false; }
      if (!validateRequired(username)) { showFieldError('reg-username','err-username','Username is required'); valid = false; }
      else if (!validateMinLength(username, 3)) { showFieldError('reg-username','err-username','Min 3 characters'); valid = false; }
      if (!validateEmail(email)) { showFieldError('reg-email','err-email','Enter a valid email'); valid = false; }
      if (!validateMinLength(password, 6)) { showFieldError('reg-password','err-password','Min 6 characters'); valid = false; }

      if (!valid) return;

      const btn = document.getElementById('register-btn');
      btn.innerHTML = '<span class="spinner"></span> Creating...';
      btn.disabled = true;

      try {
        const data = await registerStudent({ name, username, email, password });
        if (data._id) {
          setUser(data);
          showAlert('register-alert', 'Account created! Redirecting...', 'success');
          setTimeout(() => window.location.href = 'dashboard.html', 1000);
        } else {
          showAlert('register-alert', data.message || 'Registration failed', 'error');
        }
      } catch (err) {
        showAlert('register-alert', 'Network error. Please try again.', 'error');
      }
      btn.innerHTML = 'Create Account';
      btn.disabled = false;
    });
  </script>
</body>
</html>
